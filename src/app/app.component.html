<h1>To-Do List</h1>

<input
  type="text"
  [(ngModel)]="task"
  placeholder="Enter New Task"
  (keyup.enter)="addTask()" />

<button (click)="addTask()">Add Task</button>

<ul>
  <li *ngFor="let task of taskList; trackBy: trackById">
    {{ task.task }}
    <button (click)="deleteTask(task._id!)">Delete</button>


  </li>
</ul>
